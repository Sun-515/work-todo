<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="中文任务管理：编辑、优先级、截止日期、分类、子任务、备份与回收站。"><title>工作待办 · 把今天理清楚</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.mjs"></script></head><body>
<aside class="sidebar"><a class="brand" href="./"><span class="logo">✓</span><span>工作待办<small>让每一步都有着落</small></span></a><p class="nav-caption">我的工作台</p><nav aria-label="任务视图" id="views"><button data-view="all" aria-pressed="true"><span>▤　全部任务</span><b></b></button><button data-view="today" aria-pressed="false"><span>◉　今日到期</span><b></b></button><button data-view="upcoming" aria-pressed="false"><span>▦　未来七天</span><b></b></button><button data-view="overdue" aria-pressed="false"><span>◷　已逾期</span><b></b></button><button data-view="starred" aria-pressed="false"><span>☆　星标任务</span><b></b></button><button data-view="trash" aria-pressed="false"><span>♲　回收站</span><b></b></button></nav><div class="sidebar-bottom"><div class="local-badge"><i></i> 数据保存在此浏览器</div><p>无需登录 · 无跨设备同步<br>定期导出备份，让记录更安心。</p><button class="quiet" id="theme">切换深色模式</button></div></aside>
<main><header class="page-header"><div><div class="eyebrow" id="date-label"></div><h1>把今天，理清楚。</h1><p>给工作一点条理，给自己一点从容。</p></div><button class="primary" id="new-task">＋ 新建任务</button></header>
<section class="stats" aria-label="任务概览" aria-live="polite"><div><span>待完成</span><strong id="remaining">0</strong><small>全部未完成任务</small></div><div><span>今日到期</span><strong id="today-count">0</strong><small>今天需要关注</small></div><div><span>已完成</span><strong id="done-count">0</strong><small>每一步都算数</small></div><div class="progress-card"><span>完成进度 <b id="progress-text">0%</b></span><progress id="progress" max="100" value="0"></progress><small id="progress-detail"></small></div></section>
<section class="workspace" aria-label="任务管理"><div class="section-heading"><h2 id="view-title">全部任务</h2><div class="tools"><button id="export-json">导出备份</button><button id="export-csv">导出表格</button><button id="import">导入备份</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></div><form class="quick-add" id="quick-form"><span aria-hidden="true">＋</span><input id="quick-title" aria-label="快速添加任务" maxlength="200" placeholder="记下下一件要做的事，按回车添加…" required><button class="primary" type="submit">添加</button></form>
<div class="toolbar"><div class="filters" role="group" aria-label="任务状态"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="pending" aria-pressed="false">未完成</button><button data-filter="done" aria-pressed="false">已完成</button></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索任务或备注" aria-label="搜索任务或备注"></label></div><div class="refine"><label>分类 <select id="category-filter"><option value="">全部分类</option></select></label><label>优先级 <select id="priority-filter"><option value="">全部优先级</option><option value="high">高优先级</option><option value="normal">普通</option><option value="low">低优先级</option></select></label><label>排序 <select id="sort"><option value="created">最新创建</option><option value="due">截止日期</option><option value="priority">优先级</option><option value="title">任务名称</option></select></label><button class="quiet" id="reset">重置筛选</button></div>
<div class="bulk"><label><input id="select-all" type="checkbox"> 全选当前结果</label><span id="selection-count">已选 0 项</span><button id="batch-done" disabled>标记完成</button><button id="batch-delete" disabled>移入回收站</button><button id="batch-restore" hidden disabled>恢复所选</button></div><ul id="list" class="task-list" aria-label="任务列表"></ul><div class="empty" id="empty"><span aria-hidden="true">✓</span><h3>从一件小事开始</h3><p>记下第一项任务，让今天更有方向。</p><button id="empty-add" class="quiet">＋ 新建任务</button></div><div class="list-footer"><span id="result-count">显示 0 项任务</span><span id="save-label">自动保存至此浏览器</span></div></section><footer><span>一步一步，完成就好。</span><span>快捷键：N 新建 · / 搜索 · Esc 取消编辑</span></footer></main>
<dialog id="editor" aria-labelledby="editor-title"><form id="edit-form"><header><div><div class="eyebrow">MAKE ROOM FOR WHAT MATTERS</div><h2 id="editor-title">新建任务</h2></div><button type="button" id="close-editor" aria-label="关闭编辑">×</button></header><label>任务名称 <input name="title" id="edit-title" required maxlength="200" placeholder="这次要完成什么？"></label><div class="form-grid"><label>截止日期 <input name="due" type="date"></label><label>优先级 <select name="priority"><option value="normal">普通</option><option value="high">高优先级</option><option value="low">低优先级</option></select></label></div><label>分类 <input name="category" maxlength="40" list="categories" placeholder="例如：工作、学习、生活"><datalist id="categories"></datalist></label><label>备注 <textarea name="notes" rows="3" maxlength="5000" placeholder="补充细节、想法或下一步…"></textarea></label><label>子任务 <textarea name="subtasks" rows="3" maxlength="5000" placeholder="每行一项，例如：收集资料、完成初稿"></textarea><small>每行一项，保存后可逐项勾选。</small></label><label class="star-field"><input name="starred" type="checkbox"> 设为星标任务</label><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存任务</button></div></form></dialog><div class="toast" id="toast" role="status" hidden><span></span><button id="undo" hidden>撤销</button><button id="dismiss" aria-label="关闭提示">×</button></div></body></html>
